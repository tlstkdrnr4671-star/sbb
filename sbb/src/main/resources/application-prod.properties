# ══════════════════════════════════════════════════════════════════════
# [application-prod.properties] 운영(서버) 전용 설정 파일 (v4.07 새 파일)
# ══════════════════════════════════════════════════════════════════════
#
# 파일 이름의 "-prod" 가 "프로필(profile)" 이름입니다. prod = production(운영 서버).
#   · 내 PC 에서 개발할 때 : application.properties 만 읽습니다.
#   · 서버에서 실행할 때   : java -jar sbb-0.0.2.jar --spring.profiles.active=prod
#                            처럼 prod 프로필을 켜면 이 파일의 값이 application.properties 위에 덮어써집니다.
# 이렇게 나누면 개발용 DB 와 운영용 DB 설정을 코드 변경 없이 바꿔 쓸 수 있습니다.
#
# # 으로 시작하는 줄은 주석입니다. 각 줄은 "설정이름=값" 모양입니다.
# ══════════════════════════════════════════════════════════════════════
# DATABASE
# ── 운영 DB 를 H2 → PostgreSQL 로 변경 (v4.12) ──
# 이전의 H2 콘솔 설정(spring.h2.console.*)은 PostgreSQL 에서는 쓰지 않으므로 지웠습니다.
# [spring.datasource.url] 접속할 DB 주소입니다.
#   · jdbc:postgresql:// : PostgreSQL 에 접속한다는 표시
#   · <DATABASE_ENDPOINT> : DB 서버 주소 자리입니다. 실제 배포 때 AWS 가 알려 준 주소로 바꿔 적습니다.
#   · 5432 : PostgreSQL 기본 포트 번호,  /sbb : 사용할 데이터베이스 이름
spring.datasource.url=jdbc:postgresql://<DATABASE_ENDPOINT>:5432/sbb
# [driverClassName] PostgreSQL 드라이버 클래스입니다. (build.gradle 의 runtimeOnly 'org.postgresql:postgresql')
spring.datasource.driverClassName=org.postgresql.Driver
# [username] DB 접속 아이디입니다. dbmasteruser 는 AWS 라이트세일 DB 의 기본 관리자 아이디입니다.
spring.datasource.username=dbmasteruser
# [password] DB 접속 비밀번호 자리입니다. <DATABASE_PASSWORD> 를 실제 비밀번호로 바꿔 적습니다.
#   · 이 파일을 Git 에 올릴 때는 실제 비밀번호가 공개되지 않도록 주의해야 합니다.
spring.datasource.password=<DATABASE_PASSWORD>

# JPA
# [dialect] Hibernate 가 만드는 SQL 을 PostgreSQL 문법(방언)에 맞추라는 설정입니다. (H2Dialect → PostgreSQLDialect)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# [ddl-auto=update] 엔티티(자바 클래스)가 바뀌면 표에 열을 추가하는 등 자동으로 맞춥니다. 기존 데이터는 지우지 않습니다.
spring.jpa.hibernate.ddl-auto=update
# [format_sql] 로그에 찍히는 SQL 을 줄바꿈해서 보기 좋게 출력합니다.
spring.jpa.properties.hibernate.format_sql=true
# [show_sql] 실행되는 SQL 을 로그에 출력합니다.
spring.jpa.properties.hibernate.show_sql=true

# logging
# ══ 로그 파일 설정 (v4.09 추가) ══
# 운영 서버에서는 로그를 화면이 아닌 파일로 남겨서, 나중에 무슨 일이 있었는지 확인할 수 있게 합니다.
# [max-history=30] 날짜별 로그 파일을 최대 30개(약 30일치)까지만 보관하고, 오래된 것은 지웁니다.
logging.logback.rollingpolicy.max-history=30
# [max-file-size=100MB] 로그 파일 하나가 100MB 를 넘으면 새 파일로 나눠서 씁니다.
logging.logback.rollingpolicy.max-file-size=100MB
# [logging.file.name] 지금 쓰고 있는 로그 파일 위치입니다. 실행한 폴더 아래 logs/sbb.log 에 기록됩니다.
logging.file.name=logs/sbb.log
# [file-name-pattern] 날짜가 바뀌거나 크기가 넘쳐서 넘겨진(roll) 지난 파일의 이름 규칙입니다.
#   · ${LOG_FILE} : 위의 logs/sbb.log,  %d{yyyy-MM-dd} : 날짜,  %i : 같은 날 몇 번째 파일인지
#   · 예) logs/sbb.log.2024-01-15-0.log
logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE}.%d{yyyy-MM-dd}-%i.log
# [dateformat] 로그에 찍히는 시각 모양과 시간대입니다. 서버가 해외 시간이어도 한국 시간(Asia/Seoul)으로 기록합니다.
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS,Asia/Seoul
