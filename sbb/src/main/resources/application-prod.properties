# ══════════════════════════════════════════════════════════════════════
# [application-prod.properties] 운영(서버) 전용 설정 파일 (v4.07 새 파일)
# ══════════════════════════════════════════════════════════════════════
#
# 파일 이름의 "-prod" 가 "프로필(profile)" 이름입니다. prod = production(운영 서버).
#   · 내 PC 에서 개발할 때 : application.properties 만 읽습니다.
#   · 서버에서 실행할 때   : java -jar sbb-0.0.2.jar --spring.profiles.active=prod
#                            처럼 prod 프로필을 켜면 이 파일의 값이 application.properties 위에 덮어써집니다.
# 이렇게 나누면 개발용 DB 와 운영용 DB 설정을 코드 변경 없이 바꿔 쓸 수 있습니다.
#
# # 으로 시작하는 줄은 주석입니다. 각 줄은 "설정이름=값" 모양입니다.
# ══════════════════════════════════════════════════════════════════════
# DATABASE
# [spring.h2.console.enabled] H2 데이터베이스를 웹 화면(콘솔)으로 볼 수 있게 켭니다.
spring.h2.console.enabled=true
# [spring.h2.console.path] 콘솔 주소입니다. 서버주소/h2-console 로 접속합니다.
spring.h2.console.path=/h2-console
# [web-allow-others] 다른 컴퓨터(내 PC 브라우저)에서 서버의 H2 콘솔에 접속하는 것을 허용합니다.
#   · 기본값은 "서버 자신에서만 접속 가능"입니다. 원격 서버라서 켭니다. (보안상 운영에서는 주의가 필요한 설정)
spring.h2.console.settings.web-allow-others=true
# [spring.datasource.url] 접속할 DB 주소입니다. ~/local 은 서버 사용자 홈 폴더의 local.mv.db 파일입니다.
spring.datasource.url=jdbc:h2:~/local
# [driverClassName] DB 와 대화할 드라이버(통역 프로그램) 클래스입니다.
spring.datasource.driverClassName=org.h2.Driver
# [username] DB 접속 아이디입니다.
spring.datasource.username=sa
# [password] DB 접속 비밀번호입니다. 개발용 application.properties 와 달리 운영 DB 에는 비밀번호를 걸어 둡니다.
#   · 실제 서비스에서는 비밀번호를 파일에 그대로 적지 않고 환경 변수 등으로 넘기는 것이 안전합니다.
spring.datasource.password=1234

# JPA
# [dialect] Hibernate 가 만드는 SQL 을 H2 문법(방언)에 맞추라는 설정입니다.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# [ddl-auto=update] 엔티티(자바 클래스)가 바뀌면 표에 열을 추가하는 등 자동으로 맞춥니다. 기존 데이터는 지우지 않습니다.
spring.jpa.hibernate.ddl-auto=update
# [format_sql] 로그에 찍히는 SQL 을 줄바꿈해서 보기 좋게 출력합니다.
spring.jpa.properties.hibernate.format_sql=true
# [show_sql] 실행되는 SQL 을 로그에 출력합니다.
spring.jpa.properties.hibernate.show_sql=true
