<!--/* ════════════════════════════════════════════════════════════════ */-->
<!--/* [form_errors.html] 입력 오류 메시지를 보여 주는 "재사용 조각(fragment)" (v2.16 추가)  */-->
<!--/* 질문 등록 폼, 답변 등록 폼이 이 조각을 가져다 같은 방식으로 오류를 보여 줍니다.     */-->
<!--/* 사용 방법:  <div th:replace="~{form_errors :: formErrorsFragment}"></div>          */-->
<!--/* ════════════════════════════════════════════════════════════════ */-->
<!--/* [th:fragment="formErrorsFragment"] 이 div 에 "formErrorsFragment" 라는 이름표를 붙입니다.             */-->
<!--/*   다른 화면은 이 이름으로 가져다 씁니다. (재사용)                                              */-->
<!--/* class="alert alert-danger" : 부트스트랩의 빨간 경고 상자 모양입니다.                          */-->
<!--/* [th:if="${#fields.hasAnyErrors()}"] 입력 오류가 하나라도 있을 때만 상자를 만듭니다.             */-->
<!--/*   · #fields : 폼 검사 결과를 확인하는 유틸리티 객체입니다. hasAnyErrors() 는 "오류가 있나?"입니다.   */-->
<div th:fragment="formErrorsFragment" class="alert alert-danger" role="alert" th:if="${#fields.hasAnyErrors()}">
	<!--/* [th:each] 모든 오류 메시지를 한 개씩 꺼내 줄마다 하나씩 보여 줍니다.                           */-->
	<!--/*   · #fields.allErrors() : 폼의 오류 메시지 목록입니다. 예) "제목은 필수항목입니다."              */-->
	<!--/* [th:text="${err}"] 메시지 글자를 채웁니다. 이 줄은 닫는 태그 없이 "/>" 로 끝나는 표기입니다.     */-->
	<div th:each="err : ${#fields.allErrors()}" th:text="${err}" />
<!--/* 오류 상자의 끝입니다.                                                                    */-->
</div>
