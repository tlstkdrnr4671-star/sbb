<!--/* ════════════════════════════════════════════════════════════════ */-->
<!--/* [question_detail.html] 질문 상세 화면 (v2.10 추가)                       */-->
<!--/* 열리는 주소: GET /question/detail/{id} → QuestionController.detail(id) → "question_detail" → 이 파일 */-->
<!--/* 화면에 쓰이는 데이터: model 의 question (질문 한 개)                                   */-->
<!--/* ════════════════════════════════════════════════════════════════ */-->
<!--/* [h1] 가장 큰 제목 글씨 태그입니다. 여기에는 질문 제목이 들어갑니다.                           */-->
<!--/* [th:text="${question.subject}"] question 객체의 subject 값(제목 글자)을 채웁니다.                */-->
<!--/*   자바 코드로 쓰면 question.getSubject() 를 호출한 결과입니다.                                    */-->
<h1 th:text="${question.subject}"></h1>
<!--/* [div] 내용을 담는 구역(블록)입니다. 줄을 바꾸며 아래로 쌓이는 상자입니다.                         */-->
<!--/* [th:text="${question.content}"] 질문 내용 글자를 채웁니다. 이 단계에서는 원문 그대로 보입니다.      */-->
<!--/* (다음 단계에서 마크다운 변환 등 보기 좋게 꾸미는 기능이 추가됩니다)                                   */-->
<div th:text="${question.content}"></div>
