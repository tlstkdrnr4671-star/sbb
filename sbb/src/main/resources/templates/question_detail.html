<!--/* ════════════════════════════════════════════════════════════════ */-->
<!--/* [question_detail.html] 질문 상세 화면 (v2.15 갱신: 공통 틀 layout.html 을 입음)            */-->
<!--/* 머리와 부트스트랩 연결은 layout.html 이 담당합니다. 이 파일은 질문 카드, 답변 목록, 답변 폼만 씁니다.   */-->
<!--/* ════════════════════════════════════════════════════════════════ */-->
<!--/* [layout:decorate="~{layout}"] 이 화면은 layout.html 틀을 입습니다. (v2.15 추가)                */-->
<!--/* 틀이 머리, 메뉴, 스타일을 만들고 이 화면의 layout:fragment 내용을 구멍에 끼웁니다.               */-->
<html layout:decorate="~{layout}">
<!--/* [layout:fragment="content"] 이 div 가 틀의 content 구멍에 들어갑니다. (v2.15 추가)            */-->
<div layout:fragment="content" class="container my-3">
	<!--/* 아래는 일반 HTML 주석입니다. 브라우저 화면에는 보이지 않고, 페이지 소스 보기에서만 보입니다.         */-->
	<!-- 질문 -->
	<!--/* [h2] 질문 제목 글씨입니다. th:text 로 질문 제목을 넣습니다.                                   */-->
	<h2 class="border-bottom py-2" th:text="${question.subject}"></h2>
	<!--/* [card my-3] 부트스트랩 카드 디자인입니다. 질문 내용을 담는 상자입니다.                              */-->
	<div class="card my-3">
		<!--/* [card-body] 카드 안쪽 본문 영역입니다.                                                        */-->
		<div class="card-body">
			<!--/* [card-text] 질문 내용 글자 영역입니다. pre-line 은 줄바꿈을 그대로 살리는 인라인 스타일입니다.         */-->
			<div class="card-text" style="white-space: pre-line;" th:text="${question.content}"></div>
			<!--/* [d-flex justify-content-end] 날짜 상자를 오른쪽 끝으로 밀어 둡니다.                              */-->
			<div class="d-flex justify-content-end">
				<!--/* [badge] 작은 표시 상자(라벨)입니다. 작성 시각을 담습니다.                                        */-->
				<div class="badge bg-light text-dark p-2 text-start">
					<!--/* 질문 작성 시각을 'yyyy-MM-dd HH:mm' 모양으로 보여 줍니다.                                        */-->
					<div th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></div>
				</div>
			</div>
		</div>
	</div>
	<!--/* 여기부터 답변 영역입니다.                                                                      */-->
	<!-- 답변의 갯수 표시 -->
	<!--/* 답변 개수를 세서 "N개의 답변이 있습니다." 글자를 만듭니다. (#lists 와 |...| 리터럴 치환)             */-->
	<h5 class="border-bottom my-3 py-2" th:text="|${#lists.size(question.answerList)}개의 답변이 있습니다.|"></h5>
	<!-- 답변 반복 시작 -->
	<!--/* th:each 가 붙은 답변 카드입니다. 답변 개수만큼 카드가 반복해서 만들어집니다.                        */-->
	<div class="card my-3" th:each="answer : ${question.answerList}">
		<!--/* (답변 카드) 본문 영역입니다.                                                                  */-->
		<div class="card-body">
			<!--/* (답변 카드) 답변 내용을 넣습니다.                                                              */-->
			<div class="card-text" style="white-space: pre-line;" th:text="${answer.content}"></div>
			<!--/* (답변 카드) 날짜 상자를 오른쪽 끝에 둡니다.                                                      */-->
			<div class="d-flex justify-content-end">
				<!--/* (답변 카드) 작성 시각 라벨입니다.                                                              */-->
				<div class="badge bg-light text-dark p-2 text-start">
					<!--/* (답변 카드) 답변 작성 시각을 같은 모양으로 보여 줍니다.                                           */-->
					<div th:text="${#temporals.format(answer.createDate, 'yyyy-MM-dd HH:mm')}"></div>
				</div>
			</div>
		</div>
	</div>
	<!--/* 여기까지가 th:each 로 반복되는 답변 카드 영역입니다.                                            */-->
	<!-- 답변 반복 끝  -->
	<!-- 답변 작성 -->
	<!--/* 답변 입력 폼입니다. 주소 /answer/create/{질문번호} 로 POST 전송합니다.                              */-->
	<!--/* [th:object="${answerForm}"] (v2.16 추가) 이 폼은 AnswerForm 객체와 연결됩니다.                  */-->
	<!--/* 아래 th:field 의 *{...} 가 이 객체의 필드(content)를 가리킵니다.                                */-->
	<form th:action="@{|/answer/create/${question.id}|}" th:object="${answerForm}" method="post" class="my-3">
		<!--/* [textarea] 답변 입력 칸입니다. name="content" 로 컨트롤러의 @RequestParam 과 연결됩니다.           */-->
		<!--/* [th:replace] (v2.16 추가) 오류 메시지 조각(form_errors.html)을 끼워 넣습니다.                    */-->
		<!--/* 답변 내용을 비우고 등록하면 여기에 빨간 경고가 나타납니다.                                    */-->
		<div th:replace="~{form_errors :: formErrorsFragment}"></div>
		<!--/* [th:field="*{content}"] (v2.16 변경) name, id 를 자동으로 만들고 AnswerForm.content 와 연결합니다.  */-->
		<!--/* 이전 버전의 name="content" 직접 적기는 이제 필요 없습니다. 검사에 실패하면 입력한 글도 되살아납니다. */-->
		<textarea th:field="*{content}" rows="10" class="form-control"></textarea>
		<!--/* 답변등록 버튼입니다. 누르면 입력한 답변이 전송됩니다.                                              */-->
		<input type="submit" value="답변등록" class="btn btn-primary my-2">
	</form>
</div>

</html>
