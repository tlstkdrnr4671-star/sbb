<!--/* ════════════════════════════════════════════════════════════════ */-->
<!--/* [question_detail.html] 질문 상세 화면 (v2.15 갱신: 공통 틀 layout.html 을 입음)            */-->
<!--/* 머리와 부트스트랩 연결은 layout.html 이 담당합니다. 이 파일은 질문 카드, 답변 목록, 답변 폼만 씁니다.   */-->
<!--/* ════════════════════════════════════════════════════════════════ */-->
<!--/* [layout:decorate="~{layout}"] 이 화면은 layout.html 틀을 입습니다. (v2.15 추가)                */-->
<!--/* 틀이 머리, 메뉴, 스타일을 만들고 이 화면의 layout:fragment 내용을 구멍에 끼웁니다.               */-->
<html layout:decorate="~{layout}">
<!--/* [layout:fragment="content"] 이 div 가 틀의 content 구멍에 들어갑니다. (v2.15 추가)            */-->
<div layout:fragment="content" class="container my-3">
	<!--/* 아래는 일반 HTML 주석입니다. 브라우저 화면에는 보이지 않고, 페이지 소스 보기에서만 보입니다.         */-->
	<!-- 질문 -->
	<!--/* [h2] 질문 제목 글씨입니다. th:text 로 질문 제목을 넣습니다.                                   */-->
	<h2 class="border-bottom py-2" th:text="${question.subject}"></h2>
	<!--/* [card my-3] 부트스트랩 카드 디자인입니다. 질문 내용을 담는 상자입니다.                              */-->
	<div class="card my-3">
		<!--/* [card-body] 카드 안쪽 본문 영역입니다.                                                        */-->
		<div class="card-body">
			<!--/* [card-text] 질문 내용 글자 영역입니다.         */-->
			<!--/* ─ 마크다운으로 표시 (v3.12 변경) ─ */-->
			<!--/* [th:utext] th:text 와 달리 글 속의 HTML 태그를 "실제 태그"로 해석해서 보여 줍니다. (u = unescaped) */-->
			<!--/*   · th:text 였다면 <strong> 이 글자 그대로 "<strong>" 으로 보였을 것입니다. */-->
			<!--/* [${@commonUtil.markdown(question.content)}] CommonUtil 부품의 markdown() 으로 내용을 HTML 로 바꿉니다. */-->
			<!--/* 마크다운이 줄바꿈을 문단(<p>)으로 처리하므로 이전의 white-space: pre-line 스타일은 지웠습니다. */-->
			<div class="card-text" th:utext="${@commonUtil.markdown(question.content)}"></div>
			<!--/* [d-flex justify-content-end] 날짜 상자를 오른쪽 끝으로 밀어 둡니다.                              */-->
			<div class="d-flex justify-content-end">
				<!--/* ─ 수정 일시 표시 (v3.09 추가) ─ */-->
				<!--/* [th:if="${question.modifyDate != null}"] 수정한 적이 있을 때만 이 라벨을 만듭니다. */-->
				<!--/* [mx-3] 좌우 여백 3 단계입니다. 옆의 작성 일시 라벨과 간격을 둡니다. */-->
				<div th:if="${question.modifyDate != null}" class="badge bg-light text-dark p-2 text-start mx-3">
					<!--/* "modified at"(수정 시각) 글자를 보여 줍니다. */-->
					<div class="mb-2">modified at</div>
					<!--/* 수정 시각을 'yyyy-MM-dd HH:mm' 모양으로 보여 줍니다. */-->
					<div th:text="${#temporals.format(question.modifyDate, 'yyyy-MM-dd HH:mm')}"></div>
				</div>
				<!--/* [badge] 작은 표시 상자(라벨)입니다. 작성 시각을 담습니다.                                        */-->
				<div class="badge bg-light text-dark p-2 text-start">
					<!--/* [작성자 이름] (v3.08 추가) 질문을 쓴 회원의 아이디를 날짜 위에 보여 줍니다. 작성자가 없으면 칸은 비어 있습니다.                                        */-->
					<div class="mb-2">
						<span th:if="${question.author != null}" th:text="${question.author.username}"></span>
					</div>
					<!--/* 질문 작성 시각을 'yyyy-MM-dd HH:mm' 모양으로 보여 줍니다. */-->
					<div th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></div>
				</div>
			</div>
			<div class="my-3">
				<!--/* ─ 질문 추천 버튼 (v3.10 추가) ─ */-->
				<!--/* [class="recommend ..."] 아래 스크립트가 recommend 클래스 버튼을 찾아 확인 창을 붙입니다. */-->
				<!--/* [th:data-uri] 추천 주소(/question/vote/번호)를 숨겨 둡니다. 확인을 누르면 이 주소로 이동합니다. */-->
				<!--/* [span badge rounded-pill bg-success] 둥근 초록 배지에 추천 수를 보여 줍니다. */-->
				<!--/*   · #lists.size(question.voter) : 추천인 모음의 개수 = 추천 수 */-->
				<a href="javascript:void(0);" class="recommend btn btn-sm btn-outline-secondary"
					th:data-uri="@{|/question/vote/${question.id}|}">
					추천
					<span class="badge rounded-pill bg-success" th:text="${#lists.size(question.voter)}"></span>
				</a>
				<!--/* ─ 질문 수정 / 삭제 버튼 (v3.09 추가) ─ */-->
				<!--/* [my-3] 위아래 여백 3 단계 상자 안에 두 버튼을 둡니다. */-->
				<!--/* [수정 버튼] 누르면 GET /question/modify/{번호} 로 이동합니다. btn-sm : 작은 버튼, btn-outline-secondary : 회색 테두리 버튼 */-->
				<!--/* [sec:authorize="isAuthenticated()"] 로그인한 사람에게만 버튼을 만듭니다. */-->
				<!--/* [th:if="${question.author != null and #authentication.getPrincipal().getUsername() == question.author.username}"] */-->
				<!--/*   · 작성자가 있고, 로그인한 아이디와 작성자 아이디가 같을 때만 = "내 글"일 때만 보입니다. */-->
				<!--/*   · #authentication : 로그인 정보 객체, getPrincipal().getUsername() : 로그인한 아이디 */-->
				<!--/*   · and : 두 조건이 모두 참이어야 참입니다. author 가 null 이면 뒤 조건을 보지 않아 오류가 나지 않습니다. */-->
				<!--/* [th:text="수정"] 버튼 글자입니다. */-->
				<a th:href="@{|/question/modify/${question.id}|}" class="btn btn-sm btn-outline-secondary"
					sec:authorize="isAuthenticated()"
					th:if="${question.author != null and #authentication.getPrincipal().getUsername() == question.author.username}"
					th:text="수정"></a>
				<!--/* [삭제 버튼] 바로 이동하지 않고 확인 창을 먼저 띄웁니다. */-->
				<!--/*   · href="javascript:void(0);" : 눌러도 아무 데도 이동하지 않는 링크입니다. */-->
				<!--/*   · th:data-uri : 삭제 주소를 data-uri 속성에 숨겨 둡니다. 아래 스크립트가 이 값을 꺼내 씁니다. */-->
				<!--/*   · class="delete ..." : 스크립트가 "delete" 클래스를 가진 버튼을 모두 찾아 클릭 동작을 붙입니다. */-->
				<a href="javascript:void(0);" th:data-uri="@{|/question/delete/${question.id}|}"
					class="delete btn btn-sm btn-outline-secondary" sec:authorize="isAuthenticated()"
					th:if="${question.author != null and #authentication.getPrincipal().getUsername() == question.author.username}"
					th:text="삭제"></a>
			</div>
		</div>
	</div>
	<!--/* 여기부터 답변 영역입니다.                                                                      */-->
	<!-- 답변의 갯수 표시 -->
	<!--/* 답변 개수를 세서 "N개의 답변이 있습니다." 글자를 만듭니다. (#lists 와 |...| 리터럴 치환)             */-->
	<h5 class="border-bottom my-3 py-2" th:text="|${#lists.size(question.answerList)}개의 답변이 있습니다.|"></h5>
	<!-- 답변 반복 시작 -->
	<!--/* th:each 가 붙은 답변 카드입니다. 답변 개수만큼 카드가 반복해서 만들어집니다.                        */-->
	<div class="card my-3" th:each="answer : ${question.answerList}">
		<!--/* ─ 답변 위치 표시(앵커) (v3.11 추가) ─ */-->
		<!--/* [th:id="|answer_${answer.id}|"] 답변마다 id="answer_7" 같은 이름표를 붙입니다. (|...| 는 글자 이어 붙이기) */-->
		<!--/* 내용이 없는 a 태그라 화면에는 안 보이고, 주소의 #answer_7 이 이 위치를 찾아 스크롤하는 데만 쓰입니다. */-->
		<a th:id="|answer_${answer.id}|"></a>
		<!--/* (답변 카드) 본문 영역입니다.                                                                  */-->
		<div class="card-body">
			<!--/* (답변 카드) 답변 내용을 넣습니다.                                                              */-->
			<!--/* (답변 카드) 답변 내용도 마크다운 → HTML 로 바꿔 th:utext 로 보여 줍니다. (v3.12 변경) */-->
			<div class="card-text" th:utext="${@commonUtil.markdown(answer.content)}"></div>
			<!--/* (답변 카드) 날짜 상자를 오른쪽 끝에 둡니다.                                                      */-->
			<div class="d-flex justify-content-end">
				<!--/* (답변 카드) 수정한 적이 있을 때만 수정 일시 라벨을 보여 줍니다. (v3.09 추가) */-->
				<div th:if="${answer.modifyDate != null}" class="badge bg-light text-dark p-2 text-start mx-3">
					<!--/* (답변 카드) "modified at" 글자입니다. */-->
					<div class="mb-2">modified at</div>
					<!--/* (답변 카드) 답변 수정 시각입니다. */-->
					<div th:text="${#temporals.format(answer.modifyDate, 'yyyy-MM-dd HH:mm')}"></div>
				</div>
				<!--/* (답변 카드) 작성 시각 라벨입니다.                                                              */-->
				<div class="badge bg-light text-dark p-2 text-start">
					<!--/* (답변 카드) 답변 작성자 이름을 날짜 위에 보여 줍니다. (v3.08 추가) 작성자가 있을 때만 출력합니다.                                           */-->
					<div class="mb-2">
						<span th:if="${answer.author != null}" th:text="${answer.author.username}"></span>
					</div>
					<!--/* (답변 카드) 답변 작성 시각을 같은 모양으로 보여 줍니다. */-->
					<div th:text="${#temporals.format(answer.createDate, 'yyyy-MM-dd HH:mm')}"></div>
				</div>
			</div>
			<div class="my-3">
				<!--/* (답변 카드) 답변 추천 버튼입니다. 주소는 /answer/vote/답변번호, 배지에는 #lists.size(answer.voter) 추천 수 (v3.10 추가) */-->
				<a href="javascript:void(0);" class="recommend btn btn-sm btn-outline-secondary"
					th:data-uri="@{|/answer/vote/${answer.id}|}">
					추천
					<span class="badge rounded-pill bg-success" th:text="${#lists.size(answer.voter)}"></span>
				</a>
				<!--/* (답변 카드) 수정 / 삭제 버튼입니다. 질문 버튼과 같은 규칙으로 "내 답변"일 때만 보입니다. (v3.09 추가) */-->
				<!--/* [수정] GET /answer/modify/{답변번호} 로 이동합니다. */-->
				<a th:href="@{|/answer/modify/${answer.id}|}" class="btn btn-sm btn-outline-secondary"
					sec:authorize="isAuthenticated()"
					th:if="${answer.author != null and #authentication.getPrincipal().getUsername() == answer.author.username}"
					th:text="수정"></a>
				<!--/* [삭제] 확인 창을 거친 뒤 /answer/delete/{답변번호} 로 이동합니다. */-->
				<a href="javascript:void(0);" th:data-uri="@{|/answer/delete/${answer.id}|}"
					class="delete btn btn-sm btn-outline-secondary" sec:authorize="isAuthenticated()"
					th:if="${answer.author != null and #authentication.getPrincipal().getUsername() == answer.author.username}"
					th:text="삭제"></a>
			</div>
		</div>
	</div>
	<!--/* 여기까지가 th:each 로 반복되는 답변 카드 영역입니다.                                            */-->
	<!-- 답변 반복 끝  -->
	<!-- 답변 작성 -->
	<!--/* 답변 입력 폼입니다. 주소 /answer/create/{질문번호} 로 POST 전송합니다.                              */-->
	<!--/* [th:object="${answerForm}"] (v2.16 추가) 이 폼은 AnswerForm 객체와 연결됩니다.                  */-->
	<!--/* 아래 th:field 의 *{...} 가 이 객체의 필드(content)를 가리킵니다.                                */-->
	<form th:action="@{|/answer/create/${question.id}|}" th:object="${answerForm}" method="post" class="my-3">
		<!--/* [textarea] 답변 입력 칸입니다. name="content" 로 컨트롤러의 @RequestParam 과 연결됩니다.           */-->
		<!--/* [th:replace] (v2.16 추가) 오류 메시지 조각(form_errors.html)을 끼워 넣습니다.                    */-->
		<!--/* 답변 내용을 비우고 등록하면 여기에 빨간 경고가 나타납니다.                                    */-->
		<div th:replace="~{form_errors :: formErrorsFragment}"></div>
		<!--/* [th:field="*{content}"] (v2.16 변경) name, id 를 자동으로 만들고 AnswerForm.content 와 연결합니다.  */-->
		<!--/* 이전 버전의 name="content" 직접 적기는 이제 필요 없습니다. 검사에 실패하면 입력한 글도 되살아납니다. */-->
		<!--/* [sec:authorize="isAnonymous()"] (v3.08 추가) 로그인하지 않은 사람에게 보이는 칸입니다. disabled 가 붙어 있어 글을 쓸 수 없습니다.                                              */-->
		<textarea sec:authorize="isAnonymous()" disabled th:field="*{content}" class="form-control"
			rows="10"></textarea>
		<!--/* [sec:authorize="isAuthenticated()"] (v3.08 추가) 로그인한 사람에게 보이는 입력 칸입니다. 두 칸 중 하나만 화면에 나타납니다. */-->
		<textarea sec:authorize="isAuthenticated()" th:field="*{content}" class="form-control" rows="10"></textarea>
		<!--/* 답변등록 버튼입니다. 누르면 입력한 답변이 전송됩니다. */-->
		<input type="submit" value="답변등록" class="btn btn-primary my-2">
	</form>
</div>
<!--/* ═══ 삭제 확인 스크립트 (v3.09 추가) ═══ */-->
<!--/* [layout:fragment="script"] layout.html 의 script 구멍(th:block)에 이 script 태그가 끼워집니다. */-->
<!--/* 동작 순서: 삭제 버튼 클릭 → "정말로 삭제하시겠습니까?" 확인 창 → 확인을 누르면 data-uri 주소로 이동 */-->
<script layout:fragment="script" type='text/javascript'>
	// [const] 다시 바꾸지 않을 변수를 만듭니다.
	// document.getElementsByClassName("delete") : 화면에서 class 에 delete 가 들어간 요소를 모두 찾습니다.
	const delete_elements = document.getElementsByClassName("delete");
	// Array.from(...) : 찾은 요소 묶음을 배열로 바꿉니다. 그래야 forEach 를 쓸 수 있습니다.
	// forEach(function (element) {...}) : 배열의 요소를 하나씩 element 로 꺼내 중괄호 안을 실행합니다.
	Array.from(delete_elements).forEach(function (element) {
		// addEventListener('click', 함수) : 이 버튼을 클릭하면 실행할 함수를 붙입니다.
		element.addEventListener('click', function () {
			// confirm(메시지) : 확인/취소 창을 띄웁니다. 확인을 누르면 true, 취소를 누르면 false 입니다.
			if (confirm("정말로 삭제하시겠습니까?")) {
				// location.href = 주소 : 브라우저를 그 주소로 이동시킵니다.
				// this.dataset.uri : 클릭한 버튼의 data-uri 값(삭제 주소)입니다.
				location.href = this.dataset.uri;
			};
		});
	});
	// ─ 추천 확인 스크립트 (v3.10 추가) ─
	// 삭제 스크립트와 같은 방식입니다. class 에 recommend 가 있는 버튼을 모두 찾습니다.
	const recommend_elements = document.getElementsByClassName("recommend");
	// 찾은 추천 버튼마다 하나씩 클릭 동작을 붙입니다.
	Array.from(recommend_elements).forEach(function (element) {
		element.addEventListener('click', function () {
			// 확인 창에서 "확인"을 누를 때만 data-uri 주소(추천 주소)로 이동합니다.
			if (confirm("정말로 추천하시겠습니까?")) {
				location.href = this.dataset.uri;
			};
		});
	});
</script>

</html>
