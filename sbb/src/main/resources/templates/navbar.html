<!--/* ════════════════════════════════════════════════════════════════ */-->
<!--/* [navbar.html] 상단 메뉴바 "조각(fragment)" 파일 (v3.01 추가)                    */-->
<!--/* 완성된 페이지가 아니라, 다른 화면에 끼워 넣을 조각입니다.                                   */-->
<!--/* layout.html 에서 이렇게 불러 씁니다:  <nav th:replace="~{navbar :: navbarFragment}"></nav>  */-->
<!--/* ════════════════════════════════════════════════════════════════ */-->
<!--/* [th:fragment="navbarFragment"] 이 nav 를 "navbarFragment"라는 이름표가 붙은 조각으로 등록합니다.   */-->
<!--/* [navbar] 부트스트랩의 메뉴 막대 모양입니다. border-bottom 은 아래쪽 가로줄입니다.                 */-->
<!--/* navbar-expand-lg : 화면이 넓으면 메뉴를 가로로 펼치고, 좁으면 햄버거 버튼 뒤로 접습니다.              */-->
<nav th:fragment="navbarFragment" class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
	<!--/* [container-fluid] 화면 가로 전체를 쓰되 양옆에 여백을 둡니다. 메뉴 내용을 감싸는 상자입니다.      */-->
	<div class="container-fluid">
		<!--/* [navbar-brand] 사이트 로고 자리입니다. 여기서는 "SBB" 글자입니다.                               */-->
		<!--/* href="/" : 누르면 사이트 첫 주소(/)로 갑니다. 앞 단계의 MainController.root() 가 질문 목록으로 보냅니다. */-->
		<a class="navbar-brand" href="/">SBB</a>
		<!--/* [button navbar-toggler] 화면이 좁을 때 나타나는 햄버거 버튼(≡)입니다.                           */-->
		<!--/* data-bs-toggle="collapse" : "접혀 있는 영역을 펼치고 접어라"라는 부트스트랩 JS 전용 표시입니다.      */-->
		<!--/* data-bs-target="#navbarSupportedContent" : 펼치고 접을 대상의 번호표입니다. 아래 div 의 id 와 같아야 합니다. */-->
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
			<!--/* aria-* 속성은 화면 낭독기 같은 보조 도구를 위한 설명입니다.                                    */-->
			<!--/* aria-expanded="false" : "지금은 접혀 있다"는 뜻입니다. 펼치면 자바스크립트가 true 로 바꿉니다.      */-->
			aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
			<!--/* 햄버거 모양 아이콘을 그리는 빈 태그입니다. 내용 없이 CSS 가 모양을 만듭니다.                       */-->
			<span class="navbar-toggler-icon"></span>
		</button>
		<!--/* [collapse] 펼침과 접힘의 대상이 되는 영역입니다. id 가 위 data-bs-target 과 짝을 이룹니다.        */-->
		<div class="collapse navbar-collapse" id="navbarSupportedContent">
			<!--/* [ul] 메뉴 항목들을 세로 목록으로 묶습니다. me-auto 는 오른쪽 여백을 늘려 항목을 왼쪽에 붙입니다.    */-->
			<ul class="navbar-nav me-auto mb-2 mb-lg-0">
				<!--/* [li] 메뉴 항목 한 개입니다.                                                                  */-->
				<li class="nav-item">
					<!--/* [a href="#"] 메뉴 링크입니다. "#" 은 현재 페이지를 뜻해서 아직 실제 로그인 화면으로 가지 않습니다.    */-->
					<!--/* 로그인 기능은 보안 단계에서 연결합니다.                                                        */-->
					<a class="nav-link" href="#">로그인</a>
				</li>
				<li class="nav-item">
					<!--/* ─ 회원가입 메뉴 (v3.06 추가) ─                                                               */-->
					<!--/* [th:href="@{/user/signup}"] 회원가입 화면(GET /user/signup)으로 가는 링크입니다.                */-->
					<!--/* 로그인 여부와 상관없이 항상 보입니다.                                                      */-->
					<a class="nav-link" th:href="@{/user/signup}">회원가입</a>
				</li>
			</ul>
		</div>
	</div>
</nav>
