<!--/* ════════════════════════════════════════════════════════════════ */-->
<!--/* [question_list.html] 질문 목록 화면 (v2.15 갱신: 공통 틀 layout.html 을 입음)          */-->
<!--/* 이제 이 파일은 HTML 전체가 아니라 "내용 조각"만 씁니다. 머리와 스타일 연결은 layout.html 이 담당합니다. */-->
<!--/* ════════════════════════════════════════════════════════════════ */-->
<!--/* ─ 틀 선언 (v2.15 추가) ─                                                                    */-->
<!--/* [layout:decorate="~{layout}"] "이 화면은 layout.html 이라는 틀을 입겠다"는 선언입니다.                */-->
<!--/* ~{layout} : layout.html 템플릿을 가리키는 표현식입니다. 확장자 .html 은 생략합니다.                  */-->
<!--/* 결과: 아래 layout:fragment 내용이 틀의 구멍에 들어가 완성된 HTML 이 됩니다.                       */-->
<html layout:decorate="~{layout}">
<!--/* [layout:fragment="content"] 이 div 가 틀(layout.html)의 content 구멍에 들어갑니다.                 */-->
<!--/* 이름 "content" 는 layout.html 의 구멍 이름과 같아야 짝이 맞습니다.                                */-->
<!--/* [class="container my-3"] 가운데 정렬 박스와 위아래 여백입니다. (v2.14 부터 같은 디자인)            */-->
<div layout:fragment="content" class="container my-3">
	<!--/* [table] 부트스트랩 표 디자인이 적용된 표입니다.                                                */-->
	<table class="table">
		<!--/* [thead] 머리글 영역입니다. 배경을 어둡게 칠합니다.                                              */-->
		<thead class="table-dark">
			<!--/* [tr] 머리글의 한 가로줄입니다.                                                                */-->
			<tr>
				<!--/* 번호 칸의 머리글입니다.                                                                       */-->
				<th>번호</th>
				<!--/* 제목 칸의 머리글입니다.                                                                       */-->
				<th>제목</th>
				<!--/* 작성일시 칸의 머리글입니다.                                                                   */-->
				<th>작성일시</th>
			</tr>
		</thead>
		<!--/* [tbody] 본문 영역입니다. 질문 줄이 여기서 반복해서 만들어집니다.                                  */-->
		<tbody>
			<!--/* [th:each] 질문 목록을 한 개씩 꺼내 가로줄(tr)을 질문 개수만큼 만듭니다.                            */-->
			<!--/* question : 현재 질문 한 개, loop : 반복 상태 객체입니다. (loop.count 는 1부터 세는 번호)           */-->
			<tr th:each="question, loop : ${questionList}">
				<!--/* [번호 칸] loop.count 값을 글자로 넣습니다. 1번, 2번 ... 순서가 보입니다.                          */-->
				<td th:text="${loop.count}"></td>
				<!--/* [제목 칸] 칸 안에 상세 화면으로 가는 링크를 넣습니다.                                            */-->
				<td>
					<!--/* [th:href] 링크 주소 (예: /question/detail/3). [th:text] 링크 글자는 질문 제목입니다.             */-->
					<a th:href="@{|/question/detail/${question.id}|}" th:text="${question.subject}"></a>
				</td>
				<!--/* [작성일시 칸] 날짜를 'yyyy-MM-dd HH:mm' 모양으로 출력합니다. (#temporals.format)                  */-->
				<!--/* 목록 화면은 layout.html 의 구멍 안에서만 보입니다. 머리글과 메뉴는 틀이 그려 줍니다.                */-->
				<td th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></td>
			</tr>
		</tbody>
	</table>
	<!--/* ─ 질문 등록 버튼 (v2.16 추가) ─                                                        */-->
	<!--/* [th:href="@{/question/create}"] 질문 등록 화면(GET /question/create)으로 가는 링크입니다.   */-->
	<!--/* class="btn btn-primary" : 파란 버튼 모양입니다.                                         */-->
	<a th:href="@{/question/create}" class="btn btn-primary">질문 등록하기</a>
</div>

</html>
