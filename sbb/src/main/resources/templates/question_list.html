<!--/* ════════════════════════════════════════════════════════════════ */-->
<!--/* [question_list.html] 질문 목록 화면 (v2.07 추가)                         */-->
<!--/* ════════════════════════════════════════════════════════════════ */-->
<!--/* 이 파일은 "HTML 뼈대" + "th: 로 시작하는 데이터 끼워 넣기 규칙"으로 만들어집니다.                          */-->
<!--/* 열리는 주소: GET /question/list → QuestionController.list() → "question_list" 를 돌려줌 → 이 파일 */-->
<!--/* 화면에 쓰이는 데이터: model 의 questionList (질문 목록)                                                   */-->
<!--/* 브라우저가 받는 최종 HTML 에는 th: 속성이 남지 않고, 채워진 결과만 보입니다.                              */-->
<!--/* [table] 표 전체를 만드는 태그입니다. 가로줄(tr)과 칸(th, td)으로 이루어집니다.                     */-->
<table>
    <!--/* [thead] 표의 머리글 영역입니다. "항목 이름"(제목, 작성일시)을 넣는 곳입니다. 본문과 구분해서 씁니다.    */-->
    <thead>
        <!--/* [tr] table row : 표의 한 가로줄입니다. 머리글 줄도 tr 로 만듭니다.                                   */-->
        <tr>
            <!--/* [th] table header : 머리글 칸입니다. 보통 굵게 보입니다. "제목"은 고정 글자라서 th: 속성이 필요 없습니다. */-->
            <th>제목</th>
            <!--/* 머리글 두 번째 칸입니다. 고정 글자이므로 그냥 HTML 로 씁니다.                                          */-->
            <th>작성일시</th>
        </tr>
    </thead>
    <!--/* [tbody] 본문 영역입니다. 실제 질문 데이터 줄이 여기에서 반복해서 만들어집니다.                          */-->
    <tbody>
        <!--/* ═══ Thymeleaf 의 핵심 한 줄 ═══                                                                          */-->
        <!--/* [th:each] 반복문입니다. 자바의 for (Question question : questionList) 와 같은 뜻입니다.                      */-->
        <!--/* ${questionList} : 컨트롤러가 model.addAttribute("questionList", ...) 로 넣은 목록입니다.                   */-->
        <!--/* question : 목록에서 한 개씩 꺼낸 질문 객체의 이름표입니다. 아래 칸에서 question.subject 처럼 씁니다.          */-->
        <!--/* 결과: 이 <tr> 은 질문 개수만큼 복제됩니다. 질문이 3개면 표에 가로줄이 3개 만들어집니다.                    */-->
        <tr th:each="question : ${questionList}">
            <!--/* [th:text] 태그 안의 글자를 값으로 바꿔 넣는 속성입니다.                                                 */-->
            <!--/* ${question.subject} : question 객체의 subject 값을 꺼냅니다.                                            */-->
            <!--/* 자바 코드로 쓰면 question.getSubject() 를 호출한 결과입니다. (Question 클래스의 @Getter 덕분)              */-->
            <td th:text="${question.subject}"></td>
            <!--/* ${question.createDate} : question.getCreateDate() 값입니다.                                            */-->
            <!--/* 날짜 객체는 기본 모양으로 글자가 바뀌어 출력됩니다. 보기 좋은 모양(yyyy-MM-dd HH:mm)은 뒤 단계에서 씁니다.   */-->
            <td th:text="${question.createDate}"></td>
        </tr>
    <!--/* [/tbody] 본문 영역이 끝났다는 닫는 태그입니다. 여는 태그 <tbody> 와 짝을 이룹니다.                       */-->
    </tbody>
<!--/* [/table] 표가 끝났다는 닫는 태그입니다.                                                                  */-->
</table>
