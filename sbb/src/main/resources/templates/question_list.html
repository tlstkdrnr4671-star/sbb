<!--/* ════════════════════════════════════════════════════════════════ */-->
<!--/* [question_list.html] 질문 목록 화면 (v2.14 갱신: 부트스트랩 디자인 적용)                */-->
<!--/* 열리는 주소: GET /question/list → QuestionController.list() → "question_list" → 이 파일  */-->
<!--/* 디자인은 class="..." 속성으로 입힙니다. 이 class 이름들은 부트스트랩(Bootstrap)이 미리 정해 둔 것입니다. */-->
<!--/* ════════════════════════════════════════════════════════════════ */-->
<!--/* ─ 부트스트랩 연결 (v2.14 추가) ─                                                          */-->
<!--/* [link] 부트스트랩 스타일 파일을 연결합니다. 부트스트랩은 class 이름만 붙이면 표, 버튼, 카드가 예쁘게 바뀌는 CSS 모음입니다. */-->
<!--/* th:href="@{/bootstrap.min.css}" : static 폴더의 bootstrap.min.css 주소를 만들어 줍니다.                  */-->
<link rel="stylesheet" type="text/css" th:href="@{/bootstrap.min.css}">
<!--/* [container my-3] container : 화면 가운데에 적당한 폭으로 내용을 모읍니다.                            */-->
<!--/*   my-3 : 위아래 바깥 여백(margin-y) 3 단계입니다.                                                    */-->
<!--/* ─ 부트스트랩 여백 규칙 ─                                                                            */-->
<!--/*   m = margin(바깥 여백), p = padding(안쪽 여백), y = 위아래, 뒤의 숫자(0~5)가 크기입니다.            */-->
<div class="container my-3">
    <!--/* [table] 표 태그입니다. class="table" 은 부트스트랩의 깔끔한 표 디자인(간격, 줄무늬)을 적용합니다.       */-->
    <table class="table">
        <!--/* [thead] 머리글 영역입니다. class="table-dark" 는 머리글 배경을 어둡게 칠합니다.                        */-->
        <thead class="table-dark">
            <!--/* [tr] 머리글의 한 가로줄입니다.                                                                    */-->
            <tr>
                <!--/* 번호 칸(v2.14 추가). 번호 값은 아래 loop.count 로 채웁니다.                                          */-->
                <th>번호</th>
                <!--/* 제목 칸입니다. 질문 제목이 들어갑니다.                                                              */-->
                <th>제목</th>
                <!--/* 작성일시 칸입니다. 질문을 만든 날짜와 시각이 들어갑니다.                                              */-->
                <th>작성일시</th>
            </tr>
        </thead>
        <!--/* [tbody] 본문 영역입니다. 질문 줄이 여기에서 반복해서 만들어집니다.                                    */-->
        <tbody>
            <!--/* ─ 반복 상태 이름 바꾸기 (v2.14 변경) ─                                                          */-->
            <!--/* 두 번째 이름표가 index 에서 loop 로 바뀌었습니다. 이름은 자유롭게 정할 수 있습니다.                    */-->
            <!--/* loop.count : 1부터 세는 반복 번호입니다. (loop.index 는 0부터 셉니다)  예) 첫 질문 → 1                */-->
            <tr th:each="question, loop : ${questionList}">
                <!--/* [번호 칸] loop.count 값을 글자로 넣습니다. 질문 목록의 1번, 2번 ... 순서가 보입니다.                  */-->
                <td th:text="${loop.count}"></td>
                <!--/* [제목 칸] 칸 안에 상세 화면으로 가는 링크를 넣기 위해 td 를 여러 줄로 나눴습니다.                   */-->
                <td>
                    <!--/* [th:href="@{|/question/detail/${question.id}|}"] 링크 주소. 질문 번호가 들어갑니다. 예) /question/detail/3 */-->
                    <!--/* [th:text="${question.subject}"] 링크에 보이는 글자는 질문 제목입니다.                                  */-->
                    <a th:href="@{|/question/detail/${question.id}|}" th:text="${question.subject}"></a>
                </td>
                <!--/* ─ 날짜 모양 지정 (v2.14 변경) ─                                                                 */-->
                <!--/* #temporals.format(날짜, 모양) : 날짜 객체를 'yyyy-MM-dd HH:mm' 모양의 글자로 바꿉니다. 예) 2025-01-01 10:30 */-->
                <!--/* #temporals 는 날짜와 시간 전용 유틸리티 객체입니다.                                                    */-->
                <td th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></td>
            </tr>
        </tbody>
    </table>
</div>
