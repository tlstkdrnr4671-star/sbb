<!--/* ════════════════════════════════════════════════════════════════════ */-->
<!--/* [layout.html] 모든 화면이 함께 쓰는 "공통 틀(액자)" (v2.15 추가)                   */-->
<!--/* ════════════════════════════════════════════════════════════════════ */-->
<!--/* ─ 왜 틀이 필요할까요? ─                                                       */-->
<!--/* 질문 목록, 질문 상세 화면은 머리(head), 스타일 연결, 본문 틀이 모두 같습니다.            */-->
<!--/* 같은 내용을 화면마다 복사하면, 한 군데를 고칠 때 여러 파일을 모두 고쳐야 합니다.          */-->
<!--/* 그래서 공통 부분은 이 파일 한 곳에만 쓰고, 각 화면은 "내용"만 씁니다.                      */-->
<!--/*                                                                                  */-->
<!--/* ─ 레이아웃 방식 한눈에 보기 (thymeleaf-layout-dialect 사용) ─                              */-->
<!--/*   1) 이 파일에는 "구멍"이 있습니다.                                                    */-->
<!--/*        <th:block layout:fragment="content"></th:block>  ← 본문이 들어갈 구멍               */-->
<!--/*   2) 각 화면은 맨 위에서 "나는 이 틀을 입겠다"고 선언합니다.                                */-->
<!--/*        <html layout:decorate="~{layout}">                                               */-->
<!--/*   3) 각 화면은 구멍에 맞는 조각을 채웁니다.                                              */-->
<!--/*        <div layout:fragment="content"> ... </div>  ← 이 내용이 구멍에 들어갑니다         */-->
<!--/*   4) 브라우저는 "틀 + 화면 내용"을 합친 완성된 HTML 을 받습니다.                          */-->
<!--/* ════════════════════════════════════════════════════════════════════ */-->
<!--/* [doctype html] 이 문서가 HTML5 라는 선언입니다. 브라우저가 최신 규칙으로 해석하도록 알려 줍니다.      */-->
<!doctype html>
<!--/* [html lang="ko"] 문서의 언어가 한국어라는 표시입니다. 화면 낭독기나 번역 기능이 참고합니다.          */-->
<html lang="ko">
<!--/* [head] 화면에 보이지 않는 설정 영역입니다. 글자 인코딩, 제목, 스타일 파일 연결을 넣습니다.           */-->
<head>
    <!-- Required meta tags -->
    <!--/* [meta charset="utf-8"] 글자 인코딩을 UTF-8 로 정합니다. 한글이 깨지지 않게 하는 핵심 줄입니다.       */-->
    <meta charset="utf-8">
    <!--/* [viewport] 휴대폰처럼 작은 화면에서 기기 너비에 맞춰 보여 주는 설정입니다.                          */-->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- Bootstrap CSS -->
    <!--/* 부트스트랩 CSS 를 이 틀에서 한 번만 연결합니다. 이제 모든 화면이 이 틀을 통해 부트스트랩을 씁니다.   */-->
    <link rel="stylesheet" type="text/css" th:href="@{/bootstrap.min.css}">
    <!-- sbb CSS -->
    <!--/* 우리 프로젝트의 CSS(style.css) 연결입니다. 직접 만든 디자인 규칙을 두는 곳입니다.                  */-->
    <link rel="stylesheet" type="text/css" th:href="@{/style.css}">
    <!--/* [title] 브라우저 탭에 보이는 제목입니다.                                                        */-->
    <title>Hello, sbb!</title>
<!--/* [/head] 설정 영역의 끝입니다.                                                                  */-->
</head>
<!--/* [body] 화면에 실제로 보이는 내용이 들어가는 영역입니다.                                           */-->
<body>
<!-- 기본 템플릿 안에 삽입될 내용 Start -->
<!--/* ─ 구멍(슬롯) ─                                                                              */-->
<!--/* [layout:fragment="content"] 각 화면의 layout:fragment="content" 요소가 이 자리에 들어옵니다.       */-->
<!--/* [th:block] 화면에 흔적을 남기지 않는 "투명 상자"입니다. 여기서는 구멍의 이름표 역할만 합니다.           */-->
<th:block layout:fragment="content"></th:block>
<!-- 기본 템플릿 안에 삽입될 내용 End -->
<!--/* [/body] 몸 영역이 끝납니다.                                                                    */-->
</body>
<!--/* [/html] 문서 전체가 끝납니다.                                                                  */-->
</html>
