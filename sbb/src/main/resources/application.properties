# ============================================================
# [강의 노트] 설정 파일 - 이번 단계에서 "데이터베이스(DB)와 JPA"가 처음 등장합니다.
# 웹 사이트는 질문, 답변, 회원 정보를 어딘가에 "오래" 저장해야 합니다. 그 저장소가 데이터베이스입니다.
# 이 파일은 "어떤 DB를 쓸지, 어떻게 연결할지, JPA를 어떻게 동작시킬지"를 적는 곳입니다.
# 스프링 부트는 시작할 때 이 파일을 읽고, 적힌 값대로 자동으로 설정을 완성합니다.
# ============================================================
# [DATABASE 설정] 자바 프로그램이 데이터베이스에 접속하기 위한 정보들입니다.
# 우리는 H2 라는 가벼운 DB 를 씁니다. 별도 설치 없이 실행되므로 입문용으로 좋습니다.
# DATABASE
# H2 콘솔(관리 화면)을 켭니다. 콘솔에서는 DB 안의 표(테이블)와 데이터를 브라우저로 직접 볼 수 있습니다.
# 이 값을 true 로 두지 않으면 기본값(false, 꺼짐)이 적용됩니다.
spring.h2.console.enabled=true
# 콘솔 화면의 주소입니다. 프로그램 실행 후 http://localhost:8080/h2-console 로 접속합니다.
# 이름 spring.h2.console.path 는 "스프링 설정 > H2 > 콘솔 > 경로" 를 점(.)으로 이어 쓴 것입니다.
spring.h2.console.path=/h2-console
# datasource 는 "데이터 원천(DB 연결 정보)" 묶음입니다. url 은 DB 의 주소입니다.
#   jdbc      : 자바가 DB 와 대화할 때 쓰는 표준 통로(규격)
#   h2        : DB 종류 (H2)
#   ~/local   : 사용자 홈 폴더에 local 이라는 DB 파일을 저장한다는 뜻
# 그래서 데이터가 파일로 남아, 프로그램을 껐다 켜도 저장된 글이 사라지지 않습니다.
spring.datasource.url=jdbc:h2:~/local
# 드라이버(driver)는 "DB 종류별 통역사"입니다. 자바와 H2 가 서로 알아듣도록 중간에서 번역합니다.
# org.h2.Driver 는 H2 용 드라이버 클래스의 정식 이름입니다.
spring.datasource.driverClassName=org.h2.Driver
# DB 접속 아이디입니다. H2 의 기본 관리자 계정 이름은 sa(system administrator)입니다.
spring.datasource.username=sa
# DB 접속 비밀번호입니다. 지금은 개발용이라 비워 두었습니다.
# 실제 서비스에서는 반드시 비밀번호를 설정하고, 이 값을 파일에 그대로 두지 않아야 합니다.
spring.datasource.password=

# [JPA 설정] JPA(Java Persistence API)는 "자바 객체를 DB 표(테이블)에 저장하고 다시 꺼내는 규격"입니다.
# 개발자는 INSERT, SELECT 같은 SQL 문을 직접 길게 쓰는 대신, 자바 객체를 저장하고 조회하는 코드를 씁니다.
# 규격(JPA)을 실제로 구현한 엔진이 Hibernate 이고, 아래 설정은 그 엔진의 동작 방식을 정합니다.
# JPA
# dialect(방언) = DB 마다 조금씩 다른 SQL 문법을 맞춰 주는 설정입니다.
# 같은 "자동 증가 번호"도 DB 마다 쓰는 문법이 다릅니다. H2Dialect 는 "H2 문법으로 SQL 을 만들어라"라는 뜻입니다.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# ddl(Data Definition Language) = 표를 만들거나 고치는 명령(CREATE TABLE, ALTER TABLE 등)입니다.
# update : 프로그램 시작 시 @Entity 클래스를 보고, 표가 없으면 만들고 달라진 부분만 고칩니다.
# 다른 값들: none(아무것도 안 함), validate(검사만), create(매번 새로 만들어 기존 데이터 삭제)
# 개발 중에는 편하지만, 실제 서비스에서는 데이터가 날아갈 수 있어 신중하게 써야 합니다.
spring.jpa.hibernate.ddl-auto=update
