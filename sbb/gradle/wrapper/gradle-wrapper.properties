# [Gradle Wrapper 설정] gradlew 실행 파일이 읽는 설정입니다.
# gradlew 는 이 설정을 보고 지정된 버전의 Gradle 을 자동으로 내려받아 실행합니다.
# 덕분에 개발자마다 Gradle을 따로 설치하지 않아도 같은 버전으로 빌드할 수 있습니다.
# 내려받은 Gradle 을 저장할 기본 위치: 사용자 홈 폴더(GRADLE_USER_HOME)
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 내려받을 Gradle 배포 파일의 주소입니다. 여기서는 Gradle 8.5 를 사용합니다.
# (\: 는 properties 파일 규칙상 콜론을 문자로 쓰기 위한 표기입니다.)
distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
networkTimeout=10000
# true 이면 내려받는 주소가 안전한 주소인지 검사합니다.
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
