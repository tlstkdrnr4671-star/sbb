// ============================================================
// [강의 노트] build.gradle = "빌드 설명서"입니다.
// Gradle(그래들)이라는 빌드 도구가 이 파일을 읽고,
//   - 필요한 라이브러리를 인터넷에서 내려받고
//   - 자바 코드를 컴파일하고
//   - 프로그램을 실행하거나 테스트합니다.
// 문법은 Groovy(그루비)인데, 자바와 많이 닮아 읽기 어렵지 않습니다.
// ============================================================
// plugins 블록: 이 프로젝트가 쓸 "플러그인(기능 확장 조각)"을 적는 곳입니다.
plugins {
	// 자바 프로젝트로 빌드하겠다는 선언입니다. 자바 컴파일, 테스트 실행 기능이 켜집니다.
	id 'java'
	// 스프링 부트 플러그인입니다. version '3.2.1' 은 스프링 부트 버전을 3.2.1로 정한다는 뜻입니다.
	// 이 플러그인 덕분에 bootRun(실행) 같은 스프링 부트 전용 명령을 쓸 수 있습니다.
	id 'org.springframework.boot' version '3.2.1'
	// 의존성 관리 플러그인입니다. 스프링 관련 라이브러리들의 "서로 맞는 버전"을 자동으로 맞춰 줍니다.
	// 그래서 라이브러리마다 버전을 하나하나 적지 않아도 됩니다.
	id 'io.spring.dependency-management' version '1.1.4'
}

// group: 이 프로젝트를 구분하는 조직(묶음) 이름입니다. 보통 패키지 이름의 앞부분과 맞춥니다.
group = 'com.mysite'
// version: 프로젝트 버전입니다. (처음에는 0.0.1-SNAPSHOT 이었고, SNAPSHOT 은 "아직 개발 중인 임시 버전"이라는 뜻입니다)
// ─ 버전 변경 (v4.07) ─ 0.0.1-SNAPSHOT → 0.0.2
// 서버에 올릴 "정식 배포본"이라서 SNAPSHOT(개발 중 표시)을 떼고 번호를 올렸습니다.
// 빌드하면 build/libs/sbb-0.0.2.jar 처럼 파일 이름에 이 버전이 붙어서, 어떤 배포본인지 구분하기 쉽습니다.
version = '0.0.2'

// java 블록: 자바 컴파일 옵션을 적는 곳입니다.
java {
	// sourceCompatibility : 몇 버전 자바 문법으로 컴파일할지 정합니다. 실행할 PC/서버의 JDK 버전과 맞아야 합니다.
	// ─ 자바 버전 변경 (v4.05) ─ 21 → 19
	// 배포할 서버(AWS 라이트세일)에 설치한 JDK 가 19 버전이라서 그 버전에 맞춰 컴파일합니다.
	// 더 높은 버전(21)으로 컴파일한 프로그램은 낮은 버전(19) 자바에서 실행되지 않기 때문입니다.
	sourceCompatibility = '19'
}

// repositories 블록: 라이브러리를 내려받을 "창고 위치"를 정합니다.
repositories {
	// mavenCentral() 은 전 세계 자바 라이브러리가 모여 있는 공개 창고(Maven Central)입니다.
	mavenCentral()
}

// dependencies 블록: 이 프로젝트가 필요로 하는 "외부 라이브러리 목록"입니다.
// implementation     : 실행할 때도 필요한 라이브러리
// testImplementation : 테스트할 때만 필요한 라이브러리
dependencies {
	// spring-boot-starter-web: 웹 애플리케이션을 만드는 데 필요한 라이브러리 "묶음(스타터)"입니다.
	// 내장 톰캣 웹 서버, 웹 요청을 처리하는 스프링 MVC 등이 한꺼번에 들어 있습니다.
	// "스타터"란 자주 함께 쓰는 라이브러리를 한 번에 가져오는 세트 포장이라고 생각하면 됩니다.
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// 테스트용 묶음입니다. JUnit(시험 도구), AssertJ(검증 도구) 등이 들어 있습니다.
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// developmentOnly : 개발할 때만 쓰는 라이브러리라는 뜻입니다. 배포용 실행 파일에는 들어가지 않습니다.
	// spring-boot-devtools : 소스 코드를 고치면 서버를 자동으로 다시 띄워 주는 "개발 편의 도구"입니다.
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	// [Lombok(롬복)] getter, setter, 생성자처럼 반복되는 자바 코드를 자동으로 만들어 주는 도구입니다.
	// compileOnly : 컴파일(사람이 쓴 코드를 실행 가능한 형태로 바꾸는 단계)에만 필요하다는 뜻입니다.
	compileOnly 'org.projectlombok:lombok' 
	// annotationProcessor : 컴파일할 때 @Getter 같은 롬복 꼬리표를 읽고, 실제 코드를 채워 넣는 "처리기"입니다.
	// 위 compileOnly 와 이 줄이 함께 있어야 롬복이 제대로 동작합니다.
	annotationProcessor 'org.projectlombok:lombok'
	// [runtimeOnly] 프로그램을 "실행할 때만" 필요한 라이브러리라는 뜻입니다.
	// com.h2database:h2 : 설치 없이 프로그램 안에서 돌아가는 가벼운 데이터베이스(H2) 본체입니다.
	//   우리 코드가 H2 클래스를 직접 부르지 않으므로 implementation 이 아닌 runtimeOnly 를 씁니다.
	runtimeOnly 'com.h2database:h2'
	// [spring-boot-starter-data-jpa] JPA(자바와 DB를 잇는 기술) 관련 라이브러리 "묶음(스타터)"입니다.
	//   - Hibernate     : JPA 규격을 실제로 구현해서 일하는 엔진 (SQL 을 만들어 DB 에 보냄)
	//   - Spring Data JPA : Repository(저장소) 인터페이스만 적으면 저장/조회 기능을 자동으로 만들어 줌
	// 이 묶음 덕분에 우리는 SQL 을 길게 쓰지 않고도 DB 작업을 할 수 있습니다.
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// [junit-jupiter] 테스트 코드를 쓰는 데 필요한 JUnit 5 라이브러리입니다. @Test, assertEquals 를 쓰기 위해 추가합니다.
	testImplementation 'org.junit.jupiter:junit-jupiter' 
	// [testRuntimeOnly] 테스트를 "실행할 때만" 필요한 라이브러리입니다.
	// junit-platform-launcher : 테스트를 찾아서 실행하고 결과를 보고하는 "실행기"입니다. 실행 도구(Gradle, IDE)가 사용합니다.
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// ──────────────────────────────────────────────────────────────────────
	// [spring-boot-starter-thymeleaf] Thymeleaf 템플릿 엔진 묶음 (v2.07 추가)
	// ──────────────────────────────────────────────────────────────────────
	//   · 템플릿 엔진 = "HTML 뼈대 + 자바가 준 데이터"를 합쳐서 완성된 HTML 을 만드는 도구입니다.
	//   · 컨트롤러가 model 에 넣어 준 값(예: questionList)을 HTML 안에 끼워 넣는 일을 합니다.
	//   · 스타터(starter) = 관련 라이브러리를 한 번에 가져오는 묶음입니다.
	//   · 이 한 줄만 있으면 스프링 부트가 templates 폴더(src/main/resources/templates)의 .html 을 자동으로 찾습니다.
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	// ──────────────────────────────────────────────────────────────────────
	// [thymeleaf-layout-dialect] 레이아웃 기능 확장 (v2.07 추가, 실제 사용은 v2.15 부터)
	// ──────────────────────────────────────────────────────────────────────
	//   · 방언(dialect) = Thymeleaf 에 새 문법을 더해 주는 확장 기능입니다.
	//   · 이 확장이 있어야 layout:decorate, layout:fragment 같은 "공통 틀" 문법을 쓸 수 있습니다.
	//   · 여러 화면이 같은 머리글과 메뉴를 함께 쓰게 해 줍니다. (뒤 단계에서 자세히 나옵니다)
	implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'
	// ──────────────────────────────────────────────────────────────────────
	// [spring-boot-starter-validation] 입력값 검사 기능 묶음 (v2.16 추가)
	// ──────────────────────────────────────────────────────────────────────
	//   · 사용자가 폼에 쓴 값이 규칙에 맞는지 검사하는 라이브러리입니다.
	//   · 예) "제목은 비우면 안 됨", "제목은 200글자 이하" 같은 규칙을 @NotEmpty, @Size 로 적을 수 있습니다.
	//   · 검사 규칙을 쓰려면 이 라이브러리가 있어야 하므로 build.gradle 에 추가합니다.
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// ──────────────────────────────────────────────────────────────────────
	// [spring-boot-starter-security] Spring Security 묶음 (v3.05 추가)
	// ──────────────────────────────────────────────────────────────────────
	//   · 로그인, 권한 검사, CSRF 보호 같은 보안 기능을 한꺼번에 가져옵니다.
	//   · 이 라이브러리가 들어오면 모든 요청이 "보안 검문소"(필터 체인)를 거치게 됩니다.
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// [thymeleaf-extras-springsecurity6] Thymeleaf 화면에서 로그인 정보와 권한을 쓸 수 있게 해 주는 확장입니다.
	//   · 다음 단계에서 sec:authorize 라는 속성으로, 로그인 여부에 따라 버튼을 보이고 숨기는 데 씁니다.
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	// ──────────────────────────────────────────────────────────────────────
	// [commonmark] 마크다운 → HTML 변환 라이브러리 (v3.12 추가)
	// ──────────────────────────────────────────────────────────────────────
	//   · 마크다운: "# 제목", "**굵게**", "- 목록" 처럼 간단한 기호로 글 모양을 정하는 문법입니다.
	//   · 이 라이브러리가 그 글을 <h1>, <strong>, <ul><li> 같은 HTML 로 바꿔 줍니다.
	//   · 0.21.0 은 버전 번호입니다. 스프링 부트가 관리하지 않는 라이브러리라 버전을 직접 적습니다.
	implementation 'org.commonmark:commonmark:0.21.0'
	// ──────────────────────────────────────────────────────────────────────
	// [org.postgresql:postgresql] PostgreSQL 데이터베이스 드라이버 (v4.12 추가)
	// ──────────────────────────────────────────────────────────────────────
	//   · 운영 서버에서는 H2 대신 PostgreSQL 이라는 정식 데이터베이스(AWS 라이트세일 DB)를 씁니다.
	//   · 드라이버 = 자바 프로그램과 DB 사이의 통역 프로그램입니다.
	//   · 우리 코드가 직접 부르지 않고 실행할 때만 필요하므로 runtimeOnly 입니다. (H2 와 같은 이유)
	//   · 버전을 적지 않으면 스프링 부트가 맞는 버전을 골라 줍니다.
	runtimeOnly 'org.postgresql:postgresql'
}

// tasks: 빌드 작업 목록입니다. 여기서는 'test'(테스트 실행) 작업의 설정을 바꿉니다.
tasks.named('test') {
	// 테스트 실행기를 JUnit 5 방식으로 쓰겠다는 선언입니다. 이 설정이 있어야 @Test 가 실행됩니다.
	useJUnitPlatform()
}
